<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bakery Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            body {
                font-family: 'Segoe UI', sans-serif;
                background-image: url('/images/Cappuccino.jpg');
                background-size: cover;
                background-position: center;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }
        }
        .card {
                background-image: url('/images/Cappuccino.jpg');
                background-size: cover;
                background-position: center;
                background: linear-gradient(135deg, #cdc9c5, #5e3817);
                padding: 40px;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.1);
                width: 380px;
                text-align: center;
            }
        h2 { color: #8b5a2b; margin-bottom: 5px; }
        p { color: #ffffff; margin-bottom: 25px; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }
        input:focus { border-color: #8b5a2b; }
        .row { display: flex; gap: 10px; }
        .row input { flex: 1; }
        .btn {
            width: 100%;
            padding: 12px;
            background: #8b5a2b;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover { background: #6b3f1b; }
        .error { color: red; margin-bottom: 15px; font-size: 13px; }
        .success { color: green; margin-bottom: 15px; font-size: 13px; }
        .link { margin-top: 15px; font-size: 13px; color: #999; }
        .link a { color: #8b5a2b; text-decoration: none; font-weight: bold; }
        .link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <h2>Create Account</h2>
    <p>Register for your bakery account</p>

    <div th:if="${error}" class="error" th:text="${error}"></div>
    <div th:if="${success}" class="success" th:text="${success}"></div>

    <form action="register" method="post">

        <input type="text"     name="username"    placeholder="Username"         required>
        <input type="password" name="password"    placeholder="Password"         required>
        <input type="email"    name="email"       placeholder="Enter your email" required>
        <input type="tel"      name="telephone"   placeholder="Enter your telephone">
        <input type="text"     name="firstName"   placeholder="First Name">
        <input type="text"     name="lastName"    placeholder="Last Name">

        <button type="submit">Register</button>

        <p>Already have an account? <a href="index.html">Login</a></p>

    </form>
    <div class="link">
        Already have an account? <a href="/login">Login</a>
    </div>
</div>
</body>
</html>
